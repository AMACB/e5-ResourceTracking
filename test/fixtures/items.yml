<% rng = Random.new(seed = 12345) %>
<% (1..20).each do |n| %>
<% h = rng.hex %>
<%= h %>:
  name: <%= h %>
  description: It's a <%= h %>
  notes: ~
  age: <%= rng.rand(12) %>-<%= rng.rand(12)+12 %>
  price: rng.rand(900) + 100
  image: ~
  tags: h
  total: n
  unavailable: 0
  category: randomstuff
<% end %>